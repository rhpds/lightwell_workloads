---
- name: Delete Route for the Lightwell demo pod
  kubernetes.core.k8s:
    state: absent
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ ocp4_workload_lightwell_demo_name }}"
    namespace: "{{ ocp4_workload_lightwell_demo_namespace }}"

- name: Delete Service for the Lightwell demo pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ ocp4_workload_lightwell_demo_name }}"
    namespace: "{{ ocp4_workload_lightwell_demo_namespace }}"

- name: Delete Deployment for the Lightwell demo pod
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp4_workload_lightwell_demo_name }}"
    namespace: "{{ ocp4_workload_lightwell_demo_namespace }}"
